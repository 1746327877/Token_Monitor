appId: com.deepseek.monitor
productName: DeepSeek Monitor
directories:
  output: build
files:
  - src/**/*
  - renderer/dist/**/*
  - node_modules/**/*
  - package.json
win:
  icon: src/renderer/assets/icon.png
  target: nsis
mac:
  icon: assets/icon.icns
  target: dmg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
